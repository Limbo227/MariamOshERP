<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1080" viewBox="0 0 1420 1080" role="img" aria-labelledby="title desc"><title id="title">Mariam-Osh · core business flow</title><desc id="desc">Confirmed owner flow · design, not an implemented application · 10 November 2026</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#527069"/></marker></defs><rect width="100%" height="100%" fill="#f5f6f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="65" font-size="32" font-weight="700" fill="#183d35">Mariam-Osh · core business flow</text><text x="40" y="101" font-size="18" fill="#52615d">Confirmed owner flow · design, not an implemented application · 10 November 2026</text><polyline points="410,240 525,240" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="220" font-size="15" fill="#52615d">batch</text><polyline points="895,240 1010,240" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="220" font-size="15" fill="#52615d">arrival</text><polyline points="1195,332 1195,500" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="1210" y="415" font-size="15" fill="#52615d">manual decision</text><polyline points="1010,590 895,590" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="565" font-size="15" fill="#52615d">released input</text><polyline points="525,590 410,590" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="565" font-size="15" fill="#52615d">output</text><polyline points="710,820 710,682" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="755" font-size="15" fill="#52615d">linked if known</text><rect x="40" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="181" font-size="21" font-weight="600" fill="#183d35">1  Confirm supply order</text><text x="56" y="230" font-size="16" fill="#263c35">Supplier · quantity · agreed price</text><text x="56" y="262" font-size="16" fill="#263c35">Creates supplier debt once</text><text x="56" y="294" font-size="16" fill="#263c35">Draft creates no debt or stock</text><rect x="525" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="181" font-size="21" font-weight="600" fill="#183d35">2  Track the delivery batch</text><text x="541" y="230" font-size="16" fill="#263c35">Port · customs worker · wagons</text><text x="541" y="262" font-size="16" fill="#263c35">One batch can arrive on several days</text><text x="541" y="294" font-size="16" fill="#263c35">Documents and passport are optional</text><rect x="1010" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="181" font-size="21" font-weight="600" fill="#183d35">3  Receive actual weight</text><text x="1026" y="230" font-size="16" fill="#263c35">3,000 + 3,000 + 4,000 kg, for example</text><text x="1026" y="262" font-size="16" fill="#263c35">RAW / A or B · one effect per receipt</text><text x="1026" y="294" font-size="16" fill="#263c35">Debt is unchanged by receipt</text><rect x="40" y="500" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="500" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="531" font-size="21" font-weight="600" fill="#183d35">6  Finished goods available</text><text x="56" y="580" font-size="16" fill="#263c35">Packed bags are the output fact</text><text x="56" y="612" font-size="16" fill="#263c35">No additional keeper handover</text><text x="56" y="644" font-size="16" fill="#263c35">Nominal kg = bags × package size</text><rect x="525" y="500" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="500" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="531" font-size="21" font-weight="600" fill="#183d35">5  Record packed production</text><text x="541" y="580" font-size="16" fill="#263c35">+ finished bags / nominal kg</text><text x="541" y="612" font-size="16" fill="#263c35">− one matching empty sack per bag</text><text x="541" y="644" font-size="16" fill="#263c35">Both effects commit together</text><rect x="1010" y="500" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="500" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="531" font-size="21" font-weight="600" fill="#183d35">4  Compare quality / release</text><text x="1026" y="580" font-size="16" fill="#263c35">Supplier passport vs local wagon test</text><text x="1026" y="612" font-size="16" fill="#263c35">Authorised person releases manually</text><text x="1026" y="644" font-size="16" fill="#263c35">Released wheat can be issued manually</text><rect x="40" y="820" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="820" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="851" font-size="21" font-weight="600" fill="#183d35">Linked supplier settlement</text><text x="56" y="900" font-size="16" fill="#263c35">Payment reduces supplier debt</text><text x="56" y="932" font-size="16" fill="#263c35">Agreed amendment changes debt</text><text x="56" y="964" font-size="16" fill="#263c35">Original terms and history remain</text><rect x="525" y="820" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="820" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="851" font-size="21" font-weight="600" fill="#183d35">Separate manual wheat issue</text><text x="541" y="900" font-size="16" fill="#263c35">Class 4 / 5 · actual storage location</text><text x="541" y="932" font-size="16" fill="#263c35">Measured or explicitly estimated</text><text x="541" y="964" font-size="16" fill="#263c35">No automatic flour-to-wheat formula</text><rect x="1010" y="820" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="820" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="851" font-size="21" font-weight="600" fill="#183d35">Core protection</text><text x="1026" y="900" font-size="16" fill="#263c35">No negative stock or hidden edits</text><text x="1026" y="932" font-size="16" fill="#263c35">By-product estimates stay labelled</text><text x="1026" y="964" font-size="16" fill="#263c35">Sales / costing / treasury come later</text></g></svg>
