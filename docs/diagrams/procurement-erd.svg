854" font-size="15" fill="#52615d">location FK</text><polyline points="225,972 225,1035 1195,1035 1195,972" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="1022" font-size="15" fill="#52615d">receipt line → 0..1 incoming lot</text><rect x="40" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="181" font-size="21" font-weight="600" fill="#183d35">Supplier</text><text x="56" y="230" font-size="16" fill="#263c35">PK id · company_id</text><text x="56" y="262" font-size="16" fill="#263c35">Name / commercial access</text><text x="56" y="294" font-size="16" fill="#263c35">One supplier → many orders</text><rect x="525" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="181" font-size="21" font-weight="600" fill="#183d35">PurchaseOrder</text><text x="541" y="230" font-size="16" fill="#263c35">PK id · FK supplier_id</text><text x="541" y="262" font-size="16" fill="#263c35">Currency · state · agreed date</text><text x="541" y="294" font-size="16" fill="#263c35">Lines + amendments retain terms</text><rect x="1010" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="181" font-size="21" font-weight="600" fill="#183d35">OrderLine</text><text x="1026" y="230" font-size="16" fill="#263c35">PK id · FK order_id / product_id</text><text x="1026" y="262" font-size="16" fill="#263c35">Ordered quantity · unit price</text><text x="1026" y="294" font-size="16" fill="#263c35">Price unit is explicit</text><rect x="40" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="501" font-size="21" font-weight="600" fill="#183d35">GoodsReceipt</text><text x="56" y="550" font-size="16" fill="#263c35">PK id · supplier_id · optional order_id</text><text x="56" y="582" font-size="16" fill="#263c35">Effective date · confirmer · state</text><text x="56" y="614" font-size="16" fill="#263c35">One receipt → many actual lines</text><rect x="525" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="501" font-size="21" font-weight="600" fill="#183d35">Shipment (delivery batch)</text><text x="541" y="550" font-size="16" fill="#263c35">PK id · optional order_id · supplier_id</text><text x="541" y="582" font-size="16" fill="#263c35">Supplier batch · port · expected date</text><text x="541" y="614" font-size="16" fill="#263c35">One batch → many wagons / arrivals</text><rect x="1010" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="501" font-size="21" font-weight="600" fill="#183d35">TransportUnit</text><text x="1026" y="550" font-size="16" fill="#263c35">PK id · FK shipment_id</text><text x="1026" y="582" font-size="16" fill="#263c35">Wagon / truck ID · declared quantity</text><text x="1026" y="614" font-size="16" fill="#263c35">Quality inspection references wagon</text><rect x="40" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="821" font-size="21" font-weight="600" fill="#183d35">ReceiptLine</text><text x="56" y="870" font-size="16" fill="#263c35">FK receipt / product / location</text><text x="56" y="902" font-size="16" fill="#263c35">Optional order_line / transport_unit</text><text x="56" y="934" font-size="16" fill="#263c35">Actual weight · method · evidence</text><rect x="525" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="821" font-size="21" font-weight="600" fill="#183d35">StorageLocation</text><text x="541" y="870" font-size="16" fill="#263c35">PK id · FK warehouse_id</text><text x="541" y="902" font-size="16" fill="#263c35">RAW: A / B / Packaging &amp; materials</text><text x="541" y="934" font-size="16" fill="#263c35">FINISHED: Finished products</text><rect x="1010" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="821" font-size="21" font-weight="600" fill="#183d35">InventoryLot</text><text x="1026" y="870" font-size="16" fill="#263c35">PK id · unique origin_receipt_line_id</text><text x="1026" y="902" font-size="16" fill="#263c35">Incoming provenance / supplier batch</text><text x="1026" y="934" font-size="16" fill="#263c35">No invented remaining mixed-lot stock</text></g></svg>
