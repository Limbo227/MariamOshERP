<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1110" viewBox="0 0 1420 1110" role="img" aria-labelledby="title desc"><title id="title">Database relationships · production and stock</title><desc id="desc">One output line creates two effects · all-or-nothing posting · manual grain consumption is separate</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#527069"/></marker></defs><rect width="100%" height="100%" fill="#f5f6f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="65" font-size="32" font-weight="700" fill="#183d35">Database relationships · production and stock</text><text x="40" y="101" font-size="18" fill="#52615d">One output line creates two effects · all-or-nothing posting · manual grain consumption is separate</text><polyline points="410,240 525,240" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="432" y="215" font-size="15" fill="#52615d">1 → many</text><polyline points="1010,240 895,240" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="912" y="215" font-size="15" fill="#52615d">mapping FK</text><polyline points="710,332 710,470" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="405" font-size="15" fill="#52615d">one source</text><polyline points="410,560 525,560" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="535" font-size="15" fill="#52615d">issue source</text><polyline points="710,652 710,790" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="725" font-size="15" fill="#52615d">1 → effects</text><polyline points="1195,652 1195,720 895,720 895,850" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="705" font-size="15" fill="#52615d">validated FKs</text><polyline points="895,880 1010,880" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="855" font-size="15" fill="#52615d">example</text><polyline points="225,790 225,652" fill="none" stroke="#527069" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="725" font-size="15" fill="#52615d">availability check</text><rect x="40" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="181" font-size="21" font-weight="600" fill="#183d35">ProductionReport</text><text x="56" y="230" font-size="16" fill="#263c35">PK id · company · date / shift</text><text x="56" y="262" font-size="16" fill="#263c35">Actual packed output, not an order</text><text x="56" y="294" font-size="16" fill="#263c35">One report → many output lines</text><rect x="525" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="181" font-size="21" font-weight="600" fill="#183d35">OutputLine</text><text x="541" y="230" font-size="16" fill="#263c35">FK report / finished SKU / locations</text><text x="541" y="262" font-size="16" fill="#263c35">Whole bag count · nominal kg</text><text x="541" y="294" font-size="16" fill="#263c35">Snapshot of matching empty-sack SKU</text><rect x="1010" y="150" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="150" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="181" font-size="21" font-weight="600" fill="#183d35">PackagingRule</text><text x="1026" y="230" font-size="16" fill="#263c35">FK finished_product / empty_sack</text><text x="1026" y="262" font-size="16" fill="#263c35">One empty sack per finished bag</text><text x="1026" y="294" font-size="16" fill="#263c35">Version retained on output</text><rect x="525" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="501" font-size="21" font-weight="600" fill="#183d35">StockPostingSource</text><text x="541" y="550" font-size="16" fill="#263c35">Exactly one typed line reference</text><text x="541" y="582" font-size="16" fill="#263c35">Receipt / output / issue / adjustment</text><text x="541" y="614" font-size="16" fill="#263c35">Also supports authorised opening</text><rect x="40" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="501" font-size="21" font-weight="600" fill="#183d35">MaterialIssue / IssueLine</text><text x="56" y="550" font-size="16" fill="#263c35">Product / class · location · quantity</text><text x="56" y="582" font-size="16" fill="#263c35">Measured or estimated wheat use</text><text x="56" y="614" font-size="16" fill="#263c35">Optional production report link</text><rect x="1010" y="470" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="470" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="501" font-size="21" font-weight="600" fill="#183d35">Product + StorageLocation</text><text x="1026" y="550" font-size="16" fill="#263c35">Wheat / empty sack / finished SKU</text><text x="1026" y="582" font-size="16" fill="#263c35">Company + location + product scope</text><text x="1026" y="614" font-size="16" fill="#263c35">No price access for manufacturing</text><rect x="40" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="40" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="56" y="821" font-size="21" font-weight="600" fill="#183d35">ReleaseDecision</text><text x="56" y="870" font-size="16" fill="#263c35">FK receipt_line / optional inspection</text><text x="56" y="902" font-size="16" fill="#263c35">Authorised quantity · actor · reason</text><text x="56" y="934" font-size="16" fill="#263c35">Checks released grain availability</text><rect x="525" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="525" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="541" y="821" font-size="21" font-weight="600" fill="#183d35">StockLedgerEntry</text><text x="541" y="870" font-size="16" fill="#263c35">FK source / product / location</text><text x="541" y="902" font-size="16" fill="#263c35">Signed quantity · effect · actor / dates</text><text x="541" y="934" font-size="16" fill="#263c35">UNIQUE(source, effect)</text><rect x="1010" y="790" width="370" height="182" rx="9" fill="white" stroke="#b7c6c0"/><rect x="1010" y="790" width="370" height="48" rx="9" fill="#e2eee7"/><text x="1026" y="821" font-size="21" font-weight="600" fill="#183d35">OutputLine effects</text><text x="1026" y="870" font-size="16" fill="#263c35">OUTPUT: +100 bags / +5,000 kg</text><text x="1026" y="902" font-size="16" fill="#263c35">PACKAGING: −100 matching sacks</text><text x="1026" y="934" font-size="16" fill="#263c35">Wheat changes only by manual issue</text></g></svg>
