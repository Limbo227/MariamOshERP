{% extends "base.html" %}
{% block title %}Вход — Мариам-Ош ERP{% endblock %}
{% block content %}
  <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <p class="text-xs font-semibold tracking-wide text-slate-500">MARIAM-OSH ERP</p>
    <h1 class="mt-1 text-2xl font-semibold">Вход</h1>
    <form method="post" class="mt-5 space-y-4">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="rounded-md border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-900">{{ form.non_field_errors }}</div>
      {% endif %}
      {% for field in form %}
        <label class="block text-sm font-medium">
          <span>{{ field.label }}</span>
          {{ field }}
          {% for error in field.errors %}
            <span class="mt-1 block font-normal text-red-700">{{ error }}</span>
          {% endfor %}
        </label>
      {% endfor %}
      <button class="min-h-11 w-full rounded-md bg-slate-900 px-4 text-white hover:bg-slate-800">Войти</button>
    </form>
  </section>
{% endblock %}
