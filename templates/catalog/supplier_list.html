{% extends "base.html" %}
{% block title %}Поставщики{% endblock %}
{% block content %}
  <section class="rounded-lg border border-stone-200 bg-white p-5">
    <h1 class="text-2xl font-semibold">Поставщики</h1>
    <table class="mt-4 w-full text-left text-sm">
      <thead>
        <tr class="border-b border-stone-200">
          <th class="py-2">Название</th>
          <th class="py-2">Код</th>
        </tr>
      </thead>
      <tbody>
        {% for supplier in page %}
          <tr class="border-b border-stone-100">
            <td class="py-2">{{ supplier.name }}</td>
            <td class="py-2">{{ supplier.reference }}</td>
          </tr>
        {% empty %}
          <tr><td class="py-2" colspan="2">Поставщиков нет.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
