{% extends "base.html" %}
{% block title %}Новая станция{% endblock %}
{% block content %}
  <form method="post" class="rounded-lg border border-stone-200 bg-white p-5">
    {% csrf_token %}
    <h1 class="text-2xl font-semibold">Новая станция</h1>
    {% if form.non_field_errors %}<div class="mt-3 text-red-800">{{ form.non_field_errors }}</div>{% endif %}
    <label class="mt-4 block text-sm"><span class="mb-1 block">{{ form.name.label }}</span>{{ form.name }}<span class="text-red-800">{{ form.name.errors }}</span></label>
    <button class="mt-4 min-h-11 rounded bg-stone-900 px-4 text-white">Записать</button>
  </form>
{% endblock %}
