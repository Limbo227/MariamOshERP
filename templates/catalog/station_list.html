{% extends "base.html" %}
{% block title %}Станции{% endblock %}
{% block content %}
  <section class="rounded-lg border border-stone-200 bg-white p-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-2xl font-semibold">Станции отправления</h1>
      {% if can_add_stations %}
        <a class="inline-flex min-h-11 items-center rounded bg-stone-900 px-4 text-white no-underline" href="{% url 'station_create' %}">Новая станция</a>
      {% endif %}
    </div>
    <ul class="mt-4 space-y-2">
      {% for station in stations %}
        <li>{{ station.name }}</li>
      {% empty %}
        <li>Станций нет.</li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
