{% extends "base.html" %}
{% block title %}Новый контрагент{% endblock %}
{% block content %}
  <form method="post" class="rounded-lg border border-stone-200 bg-white p-5">
    {% csrf_token %}
    <h1 class="text-2xl font-semibold">Новый контрагент</h1>
    {% if form.non_field_errors %}<div class="mt-3 text-red-800">{{ form.non_field_errors }}</div>{% endif %}
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      {% for field in form %}
        <label class="block text-sm"><span class="mb-1 block">{{ field.label }}</span>{{ field }}<span class="text-red-800">{{ field.errors }}</span></label>
      {% endfor %}
    </div>
    <button class="mt-4 min-h-11 rounded bg-stone-900 px-4 text-white">Записать</button>
  </form>
{% endblock %}
